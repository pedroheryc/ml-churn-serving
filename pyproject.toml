[project]
name = "churn-serving"
version = "0.1.0"
description = "Churn baseline with scikit-learn, MLflow tracking and FastAPI serving."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "joblib>=1.4",
    "mlflow-skinny>=3.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.8",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
churn-train = "churn_serving.train:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
